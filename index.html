<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Dodge Drop</title>
<style>
  body { margin:0; background:#0f1220; display:flex; justify-content:center; align-items:center; height:100vh; font-family: sans-serif; }
  #game { width:360px; height:600px; background: linear-gradient(#1a1e3a, #0f1220); border-radius:20px; position:relative; overflow:hidden; touch-action:none; }
  canvas { display:block; }
  #ui { position:absolute; top:10px; left:10px; color:white; font-weight:bold; }
  #start { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; background:rgba(0,0,0,0.7); color:white; }
  button { padding:14px 28px; font-size:18px; border-radius:12px; border:0; background:#5b6bff; color:white; margin-top:15px; }
</style>
</head>
<body>
<div id="game">
  <canvas id="c" width="360" height="600"></canvas>
  <div id="ui">Score: <span id="score">0</span></div>
  <div id="start">
    <h2>DODGE DROP</h2>
    <p>Drag to move, dodge the blocks</p>
    <button onclick="startGame()">TAP TO START</button>
  </div>
</div>

<script>
// --- Canvas setup ---
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let score = 0, gameRunning = false;

// --- Player ---
let player = { x: 160, y: 530, w: 40, h: 40, color: '#5b6bff' };

// --- Obstacles ---
let obstacles = [];
function spawnObstacle(){
  obstacles.push({ x: Math.random()*320, y: -40, w: 40, h: 40, speed: 2 + score/100 });
}

// --- Game Loop ---
function loop(){
  if(!gameRunning) return;
  ctx.clearRect(0,0,360,600);

  // move & draw player
  ctx.fillStyle = player.color;
  ctx.fillRect(player.x, player.y, player.w, player.h);

  // move obstacles
  if(Math.random() < 0.03) spawnObstacle();
  for(let i=obstacles.length-1; i>=0; i--){
    let o = obstacles[i];
    o.y += o.speed;
    ctx.fillStyle = '#ff5b7a';
    ctx.fillRect(o.x, o.y, o.w, o.h);

    // collision check
    if(o.x < player.x+player.w && o.x+o.w > player.x && o.y < player.y+player.h && o.y+o.h > player.y){
      gameOver();
    }
    if(o.y > 600) obstacles.splice(i,1);
  }

  score++;
  document.getElementById('score').innerText = Math.floor(score/10);
  requestAnimationFrame(loop);
}

// --- Touch Controls ---
let isDragging = false;
canvas.addEventListener('touchstart', e => isDragging=true);
canvas.addEventListener('touchmove', e => {
  if(!isDragging) return;
  let touch = e.touches[0];
  let rect = canvas.getBoundingClientRect();
  player.x = (touch.clientX - rect.left) * (360 / rect.width) - 20;
});
canvas.addEventListener('touchend', () => isDragging=false);
canvas.addEventListener('mousemove', e => {
  if(e.buttons===1) {
    let rect = canvas.getBoundingClientRect();
    player.x = (e.clientX - rect.left) * (360 / rect.width) - 20;
  }
});

function startGame(){
  document.getElementById('start').style.display='none';
  score=0; obstacles=[]; gameRunning=true; loop();
}
function gameOver(){
  gameRunning=false;
  document.getElementById('start').style.display='flex';
  document.getElementById('start').innerHTML = `<h2>GAME OVER</h2><p>Score: ${Math.floor(score/10)}</p><button onclick="startGame()">RESTART</button>`;
}
</script>
</div>
</body>
</html>
